<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Add photos to the TV</title>
<style nonce="{{NONCE}}">
:root { --text: #fff; --text-2: rgba(235, 235, 245, 0.64); --line: rgba(255, 255, 255, 0.10); --fill-2: rgba(255, 255, 255, 0.14); --accent: #8fe3da; --danger: #ff6b63; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; background: #0b1720 radial-gradient(120% 80% at 0% 0%, #16303d 0%, #0b1720 55%, #071016 100%) no-repeat fixed; color-scheme: dark; }
body { margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.4 var(--font); background: transparent; }
.wrap { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 40px); }
h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
p { margin: 0; color: var(--text-2); }
.card { margin-top: 22px; padding: 18px; border-radius: 22px; background: rgba(28, 28, 30, 0.56); border: 1px solid var(--line); display: grid; gap: 12px; }
.btn { display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 14px; font: 600 17px var(--font); background: #f5f5f7; color: #0b0b0d; border: 0; cursor: pointer; }
.btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
input[type=text] { width: 100%; min-height: 50px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.28); color: var(--text); font: 17px var(--font); outline: none; }
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.bar { height: 6px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }
.msg { min-height: 22px; font-size: 15px; color: var(--text-2); }
.msg.good { color: var(--accent); }
.msg.bad { color: var(--danger); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Add photos to the TV</h1>
  <p>Your photos join the slideshow on the TV in this home. They’re resized on your phone first.</p>
  <div class="card">
    <input id="from" type="text" maxlength="30" placeholder="Your name (optional)" autocomplete="given-name">
    <label class="btn" for="files" id="pick">Choose photos</label>
    <input id="files" class="hidden-input" type="file" accept="image/*" multiple>
    <div class="bar" id="bar" hidden><i id="fill"></i></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>
</main>
<script nonce="{{NONCE}}">
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  // The code from the TV's QR code sits after the #, so it's never sent in a request line.
  var m = /^#d=([A-Za-z0-9_-]{20,128})$/.exec(location.hash);
  var token = m ? m[1] : null;
  if (m) history.replaceState(null, '', location.pathname);
  function say(text, kind) { var e = $('msg'); e.textContent = text; e.className = 'msg' + (kind ? ' ' + kind : ''); }
  if (!token) { say('Scan the QR code on the TV again to add photos.', 'bad'); $('pick').setAttribute('aria-disabled', 'true'); }
  try { $('from').value = localStorage.getItem('glot.from') || ''; } catch (e) { /* private mode */ }

  function load(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { resolve({ img: img, url: url }); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
      img.src = url;
    });
  }
  // 1920 x 1080: landscape photos fill the screen; portrait ones sit on a dark band.
  function toJpeg(img) {
    var W = 1920, H = 1080;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    x.imageSmoothingQuality = 'high';
    x.fillStyle = '#000';
    x.fillRect(0, 0, W, H);
    var w = img.naturalWidth, h = img.naturalHeight, a = w / h;
    if (a >= 1.25) {
      var sw = w, sh = h, sx = 0, sy = 0;
      if (a > W / H) { sw = h * W / H; sx = (w - sw) / 2; } else { sh = w * H / W; sy = (h - sh) / 2; }
      x.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
    } else {
      var dw = Math.round(H * a);
      x.drawImage(img, 0, 0, w, h, Math.round((W - dw) / 2), 0, dw, H);
    }
    return new Promise(function (resolve, reject) {
      c.toBlob(function (b) { c.width = 0; c.height = 0; if (b) resolve(b); else reject(new Error('encode')); }, 'image/jpeg', 0.85);
    });
  }
  function send(blob, from) {
    return new Promise(function (resolve) {
      var r = new XMLHttpRequest();
      r.open('POST', '/api/drop/photo');
      r.setRequestHeader('X-GH', '1');
      r.setRequestHeader('X-GH-Drop', token);
      r.setRequestHeader('Content-Type', 'image/jpeg');
      if (from) r.setRequestHeader('X-GH-From', encodeURIComponent(from));
      r.onload = function () { resolve(r.status); };
      r.onerror = function () { resolve(0); };
      r.send(blob);
    });
  }

  $('files').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if (!files.length || !token) return;
    var from = $('from').value.trim();
    try { localStorage.setItem('glot.from', from); } catch (x) { /* private mode */ }
    $('pick').setAttribute('aria-disabled', 'true');
    $('bar').hidden = false;
    var added = 0, i = 0, stop = null;
    function next() {
      if (i >= files.length || stop) return finish();
      var f = files[i++];
      say('Sending ' + i + ' of ' + files.length + '…');
      $('fill').style.width = Math.round((i - 1) / files.length * 100) + '%';
      load(f).then(function (l) {
        return toJpeg(l.img).then(function (b) { URL.revokeObjectURL(l.url); return send(b, from); });
      }).then(function (status) {
        if (status === 201) added += 1;
        else if (status === 401) stop = 'This code has expired. Scan the QR code on the TV again.';
        else if (status === 507) stop = 'The TV’s photo space is full.';
      }, function () { /* unreadable photo: skip it */ }).then(next);
    }
    function finish() {
      $('fill').style.width = '100%';
      $('pick').removeAttribute('aria-disabled');
      if (stop) say(stop, 'bad');
      else say(added === 1 ? 'Added. It shows on the TV next.' : added + ' photos added. They show on the TV next.', added ? 'good' : 'bad');
    }
    next();
  });
}());
</script>
</body>
</html>
