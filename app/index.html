<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>GLOT</title>
<link rel="stylesheet" href="css/tv.css">
</head>
<body>
<div id="stage">
  <div id="bg">
    <div class="bg-layer" id="bg-a"></div>
    <div class="bg-layer" id="bg-b"></div>
  </div>
  <div id="night-shade"></div>
  <div id="shade-top"></div>
  <div id="shade-left"></div>
  <div id="shade-bottom"></div>

  <!-- Top Shelf (Apple TV face): what the focused tile is, large. -->
  <div id="shelf" aria-hidden="true">
    <div id="shelf-text"><div id="shelf-kind"></div><div id="shelf-title"></div></div>
    <div id="shelf-media"></div>

  </div>

  <div id="brand" aria-hidden="true">
    <img id="brand-glyph" src="img/brand-glyph.svg" alt="">
    <div id="brand-name">GLOT</div>
  </div>

  <div id="clock" aria-hidden="true">
    <div id="date"></div>
    <div id="time"></div>
    <div id="wd-greeting" class="wd"></div>
    <div id="wd-countdown" class="wd"></div>
    <div id="weather">
      <div id="wx-now">
        <span class="wx-icon" id="wx-now-icon"></span>
        <span id="wx-now-temp"></span>
        <span id="wx-now-text"></span>
      </div>
      <div id="wx-week">
        <div id="wx-days"></div>
        <div id="wx-foot"><span id="wx-place"></span><span>Weather: Open-Meteo</span></div>
      </div>
    </div>
  </div>
  <div id="credit"></div>

  <div id="dock">
    <div id="dock-viewport"><div id="dock-row"></div></div>
  </div>
  <div id="label"></div>
  <div id="live-card"><div id="lc-wait"></div><span class="lc-badge">LIVE</span><div id="lc-title"></div></div>
  <div id="apps-hint" aria-hidden="true"><span class="chevron"></span>All apps</div>
  <div id="video-credit"></div>

  <div id="apps-shade"></div>
  <div id="allapps" role="dialog" aria-label="All apps">
    <div id="allapps-head"><span>All apps</span><span id="allapps-count"></span></div>
    <div id="allapps-view"><div id="allapps-grid"></div></div>
  </div>

  <div id="menu" role="menu"></div>

  <div id="scrim"></div>
  <div id="panel" role="dialog" aria-label="Add photos and shortcuts">
    <div class="panel-title">Add photos and shortcuts</div>
    <div class="panel-sub">Use a phone or computer on the home Wi-Fi.</div>
    <div id="panel-qr">
      <canvas id="qr-canvas" width="300" height="300"></canvas>
      <div class="qr-note">Scan to sign in</div>
    </div>
    <div class="panel-grid">
      <div class="step">
        <div class="step-num">1</div>
        <div>
          <div class="kv-label">Open</div>
          <div class="kv-value" id="panel-url"></div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div>
          <div class="kv-label">Sign in with the password</div>
          <div class="kv-value" id="panel-pw"></div>
          <div class="kv-note" id="panel-pw-note"></div>
        </div>
      </div>
    </div>
    <div class="panel-stats" id="panel-stats"></div>
    <div class="panel-buttons" id="panel-buttons"></div>
    <div class="panel-diag" id="panel-diag"></div>
  </div>

  <div id="guests" role="dialog" aria-label="Guests">
    <div class="g-title">Welcome</div>
    <div class="g-grid">
      <div class="g-card" id="g-wifi">
        <canvas id="g-wifi-qr" width="300" height="300"></canvas>
        <div class="g-name">Join the Wi-Fi</div>
        <div class="g-sub" id="g-wifi-name"></div>
        <div class="g-sub" id="g-wifi-pw"></div>
      </div>
      <div class="g-card" id="g-drop">
        <canvas id="g-drop-qr" width="300" height="300"></canvas>
        <div class="g-name">Add your photos</div>
        <div class="g-sub">They join the slideshow</div>
        <div class="g-sub" id="g-drop-count"></div>
      </div>
    </div>
    <div class="g-foot">Point your phone’s camera at a code  ·  Back to close</div>
  </div>

  <div id="toast"></div>
</div>
<script src="js/local-key.js"></script>
<script src="js/aerials.js"></script>
<script src="js/config.js"></script>
<script src="js/brands.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/weather.js"></script>
<script src="js/ambient.js"></script>
<script src="js/ytparse.js"></script>
<script src="js/platform.js"></script>
<script src="js/data.js"></script>
<script src="js/backdrop.js"></script>
<script src="js/videosaver.js"></script>
<script src="js/fps.js"></script>
<script src="js/home.js"></script>
</body>
</html>
